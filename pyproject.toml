[project]
name = "cand-pocketops"
version = "0.1.0"
description = "CAND PocketOps — web demo quản lý hồ sơ công việc theo số hiệu (dữ liệu giả lập)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "certifi>=2025.10.5",
    "django>=5.2.19,<5.3",
    "psycopg[binary]>=3.3,<3.4",
    "django-htmx>=1.29,<2",
    "django-axes>=9.0,<10",
    "whitenoise>=6.12,<7",
    "gunicorn>=27,<28",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.14",
    "pip-audit>=2.10",
    "ruff>=0.14",
    "playwright>=1.50",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore:No directory at:UserWarning"]
markers = [
    "concurrency: real PostgreSQL multi-connection race tests",
    "e2e: browser flow against a running stack (needs E2E_BASE_URL)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["*/migrations/*", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["DJ008"]  # relation/event rows are never rendered via __str__
