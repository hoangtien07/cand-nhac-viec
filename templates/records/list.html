{% extends "base.html" %}{% block title %}Hồ sơ{% endblock %}
{% block content %}
<div class="flex flex-wrap items-center gap-3 mb-4"><h1 class="text-2xl font-bold">Hồ sơ</h1>
  {% if can_create %}<a class="btn-primary ml-auto" href="{% url 'records:create' %}">+ Tạo hồ sơ</a>{% endif %}</div>
<form method="get" class="card flex flex-wrap gap-3 items-end mb-4" role="search"
      hx-get="{% url 'records:list' %}" hx-target="#record-table" hx-trigger="input changed delay:400ms from:#id_q, change from:select, submit" hx-push-url="true">
  <div class="flex-1 min-w-56"><label class="label" for="id_q">Tìm số hiệu (gốc hoặc kết quả)</label>{{ form.q }}</div>
  <div><label class="label" for="id_department">Phòng chủ trì</label>{{ form.department }}</div>
  <div><label class="label" for="id_status">Trạng thái</label>{{ form.status }}</div>
  <button class="btn-secondary">Lọc</button>
</form>
<div id="record-table">{% include "records/_list_table.html" %}</div>
{% endblock %}
