<div id="qs-selected" hx-swap-oob="innerHTML">{% if selected %}<input type="hidden" name="record" value="{{ selected.pk }}" id="qs-record">{% endif %}</div>
<span id="qs-clear" hx-swap-oob="innerHTML">{% if selected %}<button type="button" class="po-combo-clearbtn" title="Xóa" aria-label="Xóa lựa chọn" onclick="document.getElementById('qs-selected').innerHTML='';var i=document.getElementById('qs-search');i.value='';i.readOnly=false;i.focus();this.parentElement.innerHTML=''">&times;</button>{% endif %}</span>
<input id="qs-search" name="q" type="text" class="input pr-8" placeholder="Gõ số hiệu hoặc ghi chú để tìm..." autocomplete="off" role="combobox" aria-controls="qs-results"{% if selected %} value="{{ selected.reference_no }}" readonly{% endif %} hx-swap-oob="outerHTML"
  hx-get="{% url 'records:quick_submit_search' %}" hx-target="#qs-results" hx-swap="innerHTML" hx-trigger="input changed delay:300ms, focus">
<div id="qs-results" hx-swap-oob="innerHTML"></div>
