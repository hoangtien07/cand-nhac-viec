{% extends "base.html" %}{% block title %}Đăng nhập{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-10 card">
  <h1 class="text-2xl font-bold mb-1">Đăng nhập PocketOps</h1>
  <p class="text-slate-600 mb-6">Quản lý hồ sơ công việc theo số hiệu (bản demo).</p>
  <form method="post" novalidate class="space-y-4">{% csrf_token %}
    {% if form.non_field_errors %}<div class="msg msg-error" role="alert">{{ form.non_field_errors|join:" " }}</div>{% endif %}
    <div><label class="label" for="id_username">Tên đăng nhập</label>
      <input class="input" type="text" name="username" id="id_username" autocomplete="username" autofocus required value="{{ form.username.value|default:'' }}"></div>
    <div><label class="label" for="id_password">Mật khẩu</label>
      <input class="input" type="password" name="password" id="id_password" autocomplete="current-password" required></div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn-primary w-full">Đăng nhập</button>
  </form>
</div>
{% endblock %}
