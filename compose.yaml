# Local controlled demo: PostgreSQL + Django (gunicorn) + Caddy HTTPS (internal CA, localhost only).
# Secrets come from .env (copy .env.example). Nothing is published beyond 127.0.0.1.
name: pocketops
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pocketops}
      POSTGRES_USER: ${POSTGRES_USER:-pocketops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  web:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DJANGO_SETTINGS_MODULE: config.settings.demo
    depends_on:
      db: {condition: service_healthy}
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    volumes: [appvar:/app/var]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u;u.urlopen(u.Request('http://127.0.0.1:8000/healthz/',headers={'Host':'localhost'}))"]
      interval: 10s
      retries: 10
    restart: unless-stopped
  scheduler:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DJANGO_SETTINGS_MODULE: config.settings.demo
    depends_on:
      web: {condition: service_healthy}
    # Hourly; idempotent (dedupe per recipient/record/type/day) and skips before POCKETOPS earliest hour.
    command: sh -c "while true; do python manage.py send_due_reminders; sleep 3600; done"
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    depends_on: [web]
    ports: ["127.0.0.1:${DEMO_HTTPS_PORT:-8443}:8443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    restart: unless-stopped
volumes:
  pgdata:
  appvar:
  caddydata:
