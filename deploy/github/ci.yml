name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pocketops
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: pocketops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pocketops" --health-interval 5s --health-retries 20
    env:
      POSTGRES_PASSWORD: ci-only
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
        env: {DJANGO_SETTINGS_MODULE: config.settings.test}
      - run: uv run pytest -q -m "not e2e"
      - run: uv run pip-audit
      - run: uv run python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_SETTINGS_MODULE: config.settings.demo
          DJANGO_SECRET_KEY: ci-only-not-a-secret-0123456789-abcdefghijklmnopqrstuvwxyz
          DJANGO_ALLOWED_HOSTS: localhost
